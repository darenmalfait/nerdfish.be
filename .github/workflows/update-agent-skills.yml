name: Update agent skills

on:
  schedule:
    # Daily 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    name: Update skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # App token (not GITHUB_TOKEN) so the opened PR triggers Quality Gate.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NERDFISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.NERDFISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Sync project skills
        # Do not use secrets.GITHUB_TOKEN here — it cannot read the private skills repo.
        # --all installs new upstream skills; update refreshes locked ones.
        # Upstream deletions are detected but not pruned in non-interactive (-y) mode.
        env:
          DISABLE_TELEMETRY: '1'
          GH_TOKEN: ${{ secrets.NERDFISH_SKILLS_TOKEN }}
        run: |
          npx --yes skills@latest add darenmalfait/nerdfish-agent-skills --all -y
          npx --yes skills@latest update -p -y

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-agent-skills
          delete-branch: true
          draft: true
          title: 'chore: update agent skills'
          commit-message: 'chore(agents): update skill dependencies'
          body: |
            Automated sync via:
            - `npx skills add darenmalfait/nerdfish-agent-skills --all -y` (grow + refresh)
            - `npx skills update -p -y` (refresh locked skills)

            Reviews `.agents/skills/` and `skills-lock.json` only.
            Upstream deletions are not auto-pruned in CI.
          add-paths: |
            skills-lock.json
            .agents/skills
